[pytest]
testpaths = backend
pythonpath = backend
addopts =
    --strict-markers
    -p no:cacheprovider
norecursedirs =
    .git
    .pytest_cache
    backend/.pytest_cache
    backend/pytest-cache-files-*
    frontend/node_modules
    temp_uploads
    backend/temp_uploads
markers =
    integration: marks tests that depend on local files, services, or non-unit resources
