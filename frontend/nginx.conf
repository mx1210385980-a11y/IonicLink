server {
    listen 80;
    server_name _;
    client_max_body_size 64m;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass http://backend:8000/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /conductivity-legacy {
        return 308 /conductivity-legacy/;
    }

    location /conductivity-legacy/ {
        client_max_body_size 16m;
        proxy_pass http://conductivity:5000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /conductivity-legacy;
    }

    location = /pipeline {
        return 308 $scheme://$http_host/library;
    }

    location ^~ /pipeline/ {
        return 308 $scheme://$http_host/library;
    }

    location ~* ^/assets/pdf\.worker\.min-.*\.mjs$ {
        types {
            application/javascript mjs;
        }
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    location ~* \.mjs$ {
        types {
            application/javascript mjs;
        }
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    location = /guide.mp4 {
        return 404;
    }

    location = /vite.svg {
        return 404;
    }

    location / {
        add_header Cache-Control "no-store";
        try_files $uri $uri/ /index.html;
    }
}
