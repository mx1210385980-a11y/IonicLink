services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ioniclink-frontend
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      WFF_STRATEGY_CACHE_DIR: "/app/data/wff-strategy-cache"
    volumes:
      - ./data:/app/data
    ports:
      - "80:3000"
      - "8080:3000"
    restart: unless-stopped
